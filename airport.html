<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-93NPFQ6VTE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-93NPFQ6VTE');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make My Layover Fun</title>
    <style>
        /* Maintaining the sleek, brutalist aerospace theme */
        body {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f4f4f5;
            color: #111111;
        }
        header {
            padding: 40px 20px;
            border-bottom: 1px solid #d4d4d8;
            text-align: center;
            background-color: #ffffff;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #71717a;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #111111;
        }
        h1 {
            font-weight: 400;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0 0 8px 0;
        }
        .city-label {
            font-size: 0.9rem;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        /* Sharp, square cards */
        .card {
            background-color: #ffffff;
            border: 1px solid #d4d4d8;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-radius: 0;
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #71717a;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f4f4f5;
        }
        .card h3 {
            font-weight: 600;
            font-size: 1.1rem;
            margin: 0 0 12px 0;
            line-height: 1.3;
        }
        .card p {
            font-size: 0.95rem;
            color: #3f3f46;
            line-height: 1.5;
            margin: 0 0 24px 0;
            flex-grow: 1;
        }
        .duration {
            font-size: 0.8rem;
            font-weight: 600;
            background-color: #f4f4f5;
            padding: 8px 12px;
            display: inline-block;
            border: 1px solid #e4e4e7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        #error-state {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← New Search</a>
        <h1 id="airport-name">Initializing...</h1>
        <div id="airport-city" class="city-label">Standby for data</div>
    </header>
    
    <div class="container">
        <div id="activities-grid" class="grid">
            <!-- JavaScript will inject the sharp cards here -->
        </div>
        
        <div id="error-state">
            <h2>Data Not Found</h2>
            <p>We do not have layover modules compiled for this airport yet.</p>
        </div>
    </div>

    <!-- Connects the engine -->
    <script src="app.js"></script>

</body>
</html>
